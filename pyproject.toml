[project]
name = "dss"
version = "0.1.0"
description = "denied-signal-stack: GPS-denied positioning stack (VIO + orthoimagery aiding + integrity monitor), proven in simulation"
readme = "README.md"
license = "MIT"
requires-python = "==3.13.*"
dependencies = [
  "numpy>=2.2",
  "scipy>=1.14",
  "pyyaml>=6.0",
  "matplotlib>=3.9",
]

[project.scripts]
dss = "dss.cli:main"

[dependency-groups]
fusion = ["gtsam>=4.3.0"]
geo = ["rasterio>=1.4", "pyproj>=3.7", "pystac-client>=0.8", "planetary-computer>=1.0", "pygeomag>=1.1"]
render = ["mujoco>=3.3"]
vision = ["opencv-python-headless>=4.10"]
dash = ["rerun-sdk>=0.22"]
mavlink = ["pymavlink>=2.4.41"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "certifi"]

[tool.uv]
default-groups = ["fusion", "geo", "render", "vision", "dash", "mavlink", "dev"]
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "data: needs downloaded datasets",
  "gpu: needs an OpenGL context",
  "slow: long-running statistical test",
  "machine: probes this machine's environment",
  "mavlink: MAVLink output tests",
]
addopts = "-q"

[tool.ruff]
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "E731", "B905"]
