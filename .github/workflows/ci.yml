name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with: {path: "path with space/dss"}
      - uses: astral-sh/setup-uv@v6
      - name: tests
        working-directory: "path with space/dss"
        run: |
          uv sync --locked
          uv run ruff check src tests
          uv run pytest -m "not data and not gpu and not slow and not machine"
